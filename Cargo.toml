[workspace]
members = [
    "crates/snow_cli",
    "crates/snow_core",
    "crates/snow_daemon",
    "crates/snow_mcp",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.2.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
colored = "3"
crossterm = "0.29"
dirs = "6.0.0"
dotenvy = "0.15"
fs2 = "0.4"
interprocess = { version = "2.4.2", features = ["tokio"] }
open = "5"
ratatui = "0.30"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servicenow_rs = { git = "https://github.com/trepidity/servicenow_rs.git", rev = "ad9a52acebcc5d68270e4d9124fb5ccf103bb838" }
tokio = { version = "1", features = ["full"] }
toml = "1.1.2"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = "1"

# Keep useful line tables and backtraces without emitting full debug symbols for
# the large workspace test harness. Full symbols remain available via an
# explicit profile override when a debugger session requires them.
[profile.dev]
debug = 1

[profile.test]
debug = 1
