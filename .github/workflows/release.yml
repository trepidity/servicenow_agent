# Builds release binaries when a version tag (e.g. v0.1.0) is pushed.
#
# Native runners are used per OS rather than cross-compilation because the
# `rusqlite` dependency bundles and compiles SQLite from C source, which is
# far simpler against a host toolchain than under a cross linker.
#
# Produced binaries (per target):
#   - snow             (the CLI, from crates/snow_cli)
#   - snow_daemon      (the daemon, from crates/snow_daemon)
#   - snow_mcp_bridge  (the MCP bridge, from crates/snow_mcp)
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the GitHub Release and upload assets

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            # All three binaries build on Linux.
            bins: --bin snow --bin snow_daemon --bin snow_mcp_bridge
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            # All three binaries build on Windows through interprocess local sockets.
            bins: --bin snow --bin snow_daemon --bin snow_mcp_bridge

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} ${{ matrix.bins }}

      # Collect the binaries into a single archive named after the tag and target.
      - name: Package (Linux)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          staging="snow-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/snow" "$staging/"
          cp "target/${{ matrix.target }}/release/snow_daemon" "$staging/"
          cp "target/${{ matrix.target }}/release/snow_mcp_bridge" "$staging/"
          cp README.md "$staging/" 2>/dev/null || true
          tar czf "${staging}.tar.gz" "$staging"
          echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          staging="snow-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/snow.exe" "$staging/"
          cp "target/${{ matrix.target }}/release/snow_daemon.exe" "$staging/"
          cp "target/${{ matrix.target }}/release/snow_mcp_bridge.exe" "$staging/"
          cp README.md "$staging/" 2>/dev/null || true
          7z a "${staging}.zip" "$staging"
          echo "ASSET=${staging}.zip" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          # Auto-create the release on first asset; subsequent matrix jobs attach to it.
          fail_on_unmatched_files: true
